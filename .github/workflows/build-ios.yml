name: Build and test iOS app

on:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build (simulator, no signing needed)
        run: |
          xcodebuild -project iOS/vetify.xcodeproj -scheme vetify-qa \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Zip .app (build artifact for download)
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r app-ios.zip *.app

      - uses: actions/upload-artifact@v4
        with:
          name: app-ios
          path: build/Build/Products/Debug-iphonesimulator/app-ios.zip

      - name: Resolve built .app path
        run: |
          APP_PATH=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "*.app" | head -n1)
          echo "Found app at: $APP_PATH"
          echo "MOBILE_APP_PATH_IOS=$APP_PATH" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm dependencies
        run: npm install

      - name: Install Appium XCUITest driver
        run: npx appium driver install xcuitest

      - name: Pick an available iPhone simulator on this runner
        run: node mobile/config/pick-ios-simulator.mjs

      - name: Sanity-check network reachability to the QA site from this runner
        run: |
          curl -sS -o /dev/null -w "HTTP status: %{http_code}, total time: %{time_total}s\n" \
            --max-time 15 https://vetify-qa.ikeapp.com/ || echo "curl FAILED to reach vetify-qa.ikeapp.com from this runner"

      - name: Start device log capture (waits for Appium to boot the simulator itself, doesn't boot it directly)
        run: |
          (
            while ! xcrun simctl list devices | grep "$MOBILE_IOS_DEVICE_UDID" | grep -q Booted; do
              sleep 2
            done
            xcrun simctl spawn "$MOBILE_IOS_DEVICE_UDID" log stream --level debug --style compact > simulator.log 2>&1
          ) &
          echo $! > simctl_log.pid

      - name: Run iOS smoke test (Appium + local Simulator, no BrowserStack)
        env:
          APP_ENV: qa
          AUTH_API_BASE_URL: https://ike-webapp-staging.us.auth0.com
          VETIFY_WEBAPP_BASE_URL: https://vetify-qa.ikeapp.com
          VETIFY_INSTITUTIONAL_BASE_URL: https://qa.vetify.com.ar
          OSDE_CAPITADO_INSTITUTIONAL_BASE_URL: https://qa.vetify.com.ar/osde
          OSDE_ADQUIRENTE_INSTITUTIONAL_BASE_URL: https://qa.vetify.com.ar/mas-osde-beneficios
          FLUX_CAPITADO_INSTITUTIONAL_BASE_URL: https://qa.vetify.com.ar/flux
          IKE_WEBAPP_BASE_URL: https://ikeargentina-qa.ikeapp.com
        run: npx wdio run ./mobile/config/wdio.ios.conf.ts --spec mobile/specs/example/app-launch.spec.ts

      - name: Check whether the app is actually installed on the simulator
        if: always()
        run: |
          echo "--- xcrun simctl listapps (filtered for vetify) ---"
          xcrun simctl listapps "$MOBILE_IOS_DEVICE_UDID" | grep -i -A5 -B5 vetify || echo "NOT FOUND in listapps output"
          echo "--- xcrun simctl get_app_container ---"
          xcrun simctl get_app_container "$MOBILE_IOS_DEVICE_UDID" com.vetify.qa.webapp || echo "get_app_container FAILED (app not installed under that bundle id)"

      - name: Stop device log capture
        if: always()
        run: kill "$(cat simctl_log.pid)" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results-mobile
          path: allure-results-mobile

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-log
          path: simulator.log
